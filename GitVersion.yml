mode: Mainline
# assembly-version: If this number changes, other assemblies have to update references to the assembly
assembly-versioning-scheme: Major
assembly-file-versioning-scheme: MajorMinorPatch
tag-prefix: release\/
ignore:
  sha: []

branches:
  main:
    is-release-branch: true
    tag: ''
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    tag: pr
    tag-number-pattern: '[/-](?<number>\d+)[-/]'
  hotfix:
    regex: ^hotfix(es)?[/-]
    tag: useBranchName
  feature:
    regex: ^(personal|dev|feature|auto\-nuget\-update|dependabot)[/-]
    tag: useBranchName
  # GitHub merge-queue branches, gh-readonly-queue/<base>/pr-<n>-<sha> (docs/ci/full-test-matrix.md). Without this
  # entry the version takes the whole branch name, so every PR's queue run would get the same build number (the image
  # tag and Key Vault names). This versions it like the PR's own run: <version>-pr<n>.<count>.
  merge-queue:
    regex: ^gh-readonly-queue[/-]
    tag: pr
    tag-number-pattern: '[/-]pr-(?<number>\d+)-'
    source-branches: ['main']
