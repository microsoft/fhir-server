# Configuration based on https://help.github.com/en/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget"
    # Points at a project that exists only for discovery. Dependabot re-runs a full discovery pass
    # before every group below; against "/" that walked all 78 projects each time, cost ~4 minutes
    # per group and pushed the job past GitHub's fixed 55 minute limit, so later groups never ran.
    # See build/DependabotDiscovery/README.md.
    directory: "/build/DependabotDiscovery"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 20
    # Naming labels here replaces Dependabot's defaults, which are the lowercase "dependencies" plus
    # a per-ecosystem label such as ".NET". That is deliberate: this repo labels dependency PRs
    # "Dependencies" and "Open source" and does not use the per-ecosystem labels. Label matching is
    # case insensitive, so the casing that lands on a PR is the casing defined in the repo.
    labels:
      - "Dependencies"
      - "Open source"
    groups:
      hl7-fhir:
        patterns:
          - "Hl7.Fhir.*"
      azure-sdk:
        patterns:
          - "Azure.*"
      dotnet-sdk-release-train:
        patterns:
          - "Microsoft.Extensions.*"
          - "System.Collections.Immutable"
          - "System.Configuration.ConfigurationManager"
          - "System.Diagnostics.PerformanceCounter"
          - "System.Security.Cryptography.*"
          - "System.Text.Encodings.Web"
        exclude-patterns:
          - "Microsoft.Extensions.Logging.ApplicationInsights"
          - "Microsoft.Extensions.TimeProvider.Testing"
      aspnetcore-release-train:
        patterns:
          - "Microsoft.AspNetCore.*"
        exclude-patterns:
          - "Microsoft.AspNetCore.Http"
      openiddict:
        patterns:
          - "OpenIddict.*"
      ignixa:
        patterns:
          - "Ignixa.*"
      sql-client:
        patterns:
          - "Microsoft.Data.SqlClient*"
      minor-and-patch:
        patterns:
          - "*"
        # "*" matches what the groups above claim too, and Dependabot closes their PRs as superseded
        # by this one. Keep every pattern above listed here.
        exclude-patterns:
          - "Hl7.Fhir.*"
          - "Azure.*"
          - "Microsoft.Extensions.*"
          - "System.Collections.Immutable"
          - "System.Configuration.ConfigurationManager"
          - "System.Diagnostics.PerformanceCounter"
          - "System.Security.Cryptography.*"
          - "System.Text.Encodings.Web"
          - "Microsoft.AspNetCore.*"
          - "OpenIddict.*"
          - "Ignixa.*"
          - "Microsoft.Data.SqlClient*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 20
    labels:
      - "Dependencies"
      - "Open source"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/build/docker"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 20
    labels:
      - "Dependencies"
      - "Open source"
    groups:
      dotnet-images:
        # Dependabot's dependency names for the Dockerfile images are "dotnet/sdk" and
        # "dotnet/aspnet"; matching on the full mcr.microsoft.com/... path silently groups nothing.
        patterns:
          - "dotnet/*"
