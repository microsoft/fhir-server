name: "Code Scanning - Action"

on:
  push:
    branches: main
    paths-ignore:
      - '**/*.md'
      - '**/*.json'
      - '**/*.http'

  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.json'
      - '**/*.http'

  schedule:
    - cron: '0 0 * * 0'

jobs:
  CodeQL-Build:
    permissions:
        actions: read
        contents: read
        pull-requests: write
        security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['csharp', 'javascript']

    # runs-on: [self-hosted, 1ES.Pool=GithubRunPool]
    runs-on: "ubuntu-latest"

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Fetch all history for all tags and branches
      run: |
        git fetch --prune --unshallow

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: ./global.json

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: ${{ matrix.language }}
        config: |
          queries:
            - uses: security-and-quality
          query-filters:
            - exclude:
                id:
                  - cs/web/missing-function-level-access-control

    - name: dotnet restore
      run: dotnet restore

    - name: Autobuild
      uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
