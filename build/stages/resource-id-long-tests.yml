parameters:
- name: version
  type: string
  values:
  - Stu3
  - R4
  - R5
- name: baselineAppName
  type: string
- name: lifecycle
  type: string
  values:
  - PR
  - CI

stages:
- stage: test${{ parameters.version }}SqlLong128
  displayName: 'Run ${{ parameters.version }} SQL Long128 boundaries'
  dependsOn:
  - test${{ parameters.version }}Sql
  jobs:
  - job: LongResourceIds
    timeoutInMinutes: 45
    pool:
      name: '$(InternalPool)'
      demands:
      - ImageOverride -equals $(InternalLinuxImage)
    steps:
    - template: ../jobs/e2e-setup.yml
    - task: AzurePowerShell@5
      displayName: 'Create or update only the Long128 app and its vault reader'
      inputs:
        azureSubscription: $(ConnectedServiceName)
        azurePowerShellVersion: latestVersion
        pwsh: true
        ScriptType: FilePath
        ScriptPath: '$(System.DefaultWorkingDirectory)/build/jobs/scripts/Set-LongResourceIdApp.ps1'
        ScriptArguments: >-
          -Version "${{ parameters.version }}"
          -Lifecycle "${{ parameters.lifecycle }}"
          -BuildId "$(Build.BuildId)"
          -ResourceGroupName "$(UniqueResourceGroupName)"
          -BaselineAppName "${{ parameters.baselineAppName }}"
          -SqlServerName "$(DeploymentEnvironmentName)"
          -ExpectedImage "$(azureContainerRegistry)/${{ lower(parameters.version) }}_fhir-server:$(ImageTag)"
          -ExpectedAudience "$(TestApplicationResource)"
          -EvidencePath "$(Agent.TempDirectory)/long128-${{ parameters.version }}/deployment.json"
          -MinReplicas $(minReplicas)
    - task: PublishBuildArtifacts@1
      displayName: 'Publish credential-free Long128 ownership and readiness'
      inputs:
        pathToPublish: '$(Agent.TempDirectory)/long128-${{ parameters.version }}'
        artifactName: 'Long128Deployment_${{ parameters.version }}'
    - template: ../jobs/e2e-tests.yml
      parameters:
        version: ${{ parameters.version }}
        containerAppName: $(LongResourceIdAppName)
        appServiceType: SqlServer
        categoryFilter: 'Category=ResourceIdBoundary'
        resourceIdProfile: Long128
        testRunTitleSuffix: ' Long128'
