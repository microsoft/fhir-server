parameters:
- name: testStage
  type: string
- name: version
  type: string
  values:
  - Stu3
  - R4
  - R5

stages:
- stage: cleanup_${{ parameters.testStage }}
  displayName: 'Clean up ${{ parameters.version }} SQL resources'
  dependsOn:
  - ${{ parameters.testStage }}
  condition: and(not(canceled()), eq(dependencies.${{ parameters.testStage }}.result, 'Succeeded'))
  jobs:
  - job: CleanupResources
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    steps:
    - task: AzurePowerShell@5
      displayName: 'Delete stage-owned app and datastore'
      inputs:
        azureSubscription: $(ConnectedServiceName)
        azurePowerShellVersion: latestVersion
        pwsh: true
        ScriptType: FilePath
        ScriptPath: '$(System.DefaultWorkingDirectory)/build/jobs/scripts/Cleanup-PrTestResources.ps1'
        ScriptArguments: >-
          -Version "${{ parameters.version }}"
          -ResourceGroupName "$(UniqueResourceGroupName)"
          -DeploymentEnvironmentName "$(DeploymentEnvironmentName)"
          -PrNumber "$(prName)"
          -BuildId "$(Build.BuildId)"
