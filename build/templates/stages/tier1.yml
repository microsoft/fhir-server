# Tier 1 of PR validation (docs/arch/adr-2611-tiered-pr-validation.md): each FHIR version's E2E and integration test projects are built once
# (jobs/tier1-build.yml), then its SQL E2E tests run against an in-process server and its SQL integration tests run
# directly, in sharded jobs with SQL Server and Azurite in containers on the agent. Needs no service connection, Key
# Vault or secret. Included by pr-pipeline.yml when validationMode is not legacy.
#
# Stages:
#   Classify          classifies the PR's validation scope (jobs/classify-pr.yml); depends on nothing.
#   Tier1Tests        R4, the source scanners and the R4 image smoke; depends on nothing, so the lean path never waits
#                     for the classifier.
#   Tier1TestsStu3R5  Stu3 and R5, when the scope is shared or full. A separate stage because its condition needs the
#                     Classify output, and a stage can read another stage's output only by depending on it: in
#                     Tier1Tests that dependency would delay the R4 legs.
parameters:
# Shadow: no job fails the run (jobs and steps continue on error) and test runs are named "[shadow] ...".
- name: shadow
  type: boolean
  default: false
# Scope of a manual run (jobs/classify-pr.yml): auto classifies the PR.
- name: scopeOverride
  type: string
  default: 'auto'
  values:
  - 'auto'
  - 'lean'
  - 'shared'
  - 'full'
# Shard indexes of build/test-shards/sql-e2e.json; must list every shard of the manifest.
- name: shards
  type: object
  default: [0, 1, 2, 3, 4, 5, 6, 7, 8]
# E2E legs of one version that run at the same time; the shard count runs every shard at once.
- name: maxParallel
  type: number
  default: 9
# Trait filters of the E2E shards; keep them equal to the traitArgs of the shard lint (stages/container-tests.yml).
- name: e2eTraitArgs
  type: object
  default: ['--filter-trait', 'DataStore=SqlServer', '--filter-not-trait', 'Category=ExportLongRunning']
# Versions that run only when the scope is shared or full, in run order.
- name: sharedVersions
  type: object
  default: [Stu3, R5]

stages:
- stage: Classify
  displayName: 'Classify PR validation scope'
  dependsOn: []
  jobs:
  - template: ../jobs/classify-pr.yml
    parameters:
      scopeOverride: ${{ parameters.scopeOverride }}
      shadow: ${{ parameters.shadow }}

- stage: Tier1Tests
  displayName: 'Tier 1 tests (build once, SQL Server and Azurite containers)'
  dependsOn: []
  jobs:
  # Source scanners (Windows) and the R4 image smoke wait for nothing and run beside the tests.
  - template: ../jobs/tier1-source-scan.yml
    parameters:
      shadow: ${{ parameters.shadow }}

  - template: ../jobs/tier1-image-smoke.yml
    parameters:
      shadow: ${{ parameters.shadow }}

  - template: ../jobs/tier1-version.yml
    parameters:
      version: R4
      shadow: ${{ parameters.shadow }}
      shards: ${{ parameters.shards }}
      maxParallel: ${{ parameters.maxParallel }}
      e2eTraitArgs: ${{ parameters.e2eTraitArgs }}

# not(canceled()) rather than succeeded(): a fork PR whose scope is full fails Classify (job RequireMaintainer), and
# fork PRs still run all of Tier 1. A failed classifier sets no scope, so the stage is skipped (and the run fails).
- stage: Tier1TestsStu3R5
  displayName: 'Tier 1 tests, Stu3 and R5 (shared and full scope)'
  dependsOn: Classify
  condition: and(not(canceled()), in(dependencies.Classify.outputs['ClassifyPr.scope.ValidationScope'], 'shared', 'full'))
  jobs:
  - ${{ each version in parameters.sharedVersions }}:
    - template: ../jobs/tier1-version.yml
      parameters:
        version: ${{ version }}
        shadow: ${{ parameters.shadow }}
        shards: ${{ parameters.shards }}
        maxParallel: ${{ parameters.maxParallel }}
        e2eTraitArgs: ${{ parameters.e2eTraitArgs }}
