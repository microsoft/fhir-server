# Unit tests for the Tier 1 PR path (validationMode tier1): each framework's unit test projects are split in two shares by
# duration (build/test-shards/unit-tests.json), and each share is one job that builds only its projects and runs them
# without coverage. The stage depends on no other stage, so no job waits for the UpdateVersion stage or its semver.
stages:
- stage: BuildUnitTests
  displayName: 'Build and run unit tests'
  dependsOn: []
  jobs:
  - template: ../jobs/unit-tests-shard.yml
    parameters:
      jobName: UnitTests_net11_A
      targetFramework: ${{ variables.defaultBuildFramework }}
      moduleShard: '1/2'
  - template: ../jobs/unit-tests-shard.yml
    parameters:
      jobName: UnitTests_net11_B
      targetFramework: ${{ variables.defaultBuildFramework }}
      moduleShard: '2/2'
  - template: ../jobs/unit-tests-shard.yml
    parameters:
      jobName: UnitTests_net10_A
      targetFramework: 'net10.0'
      moduleShard: '1/2'
  - template: ../jobs/unit-tests-shard.yml
    parameters:
      jobName: UnitTests_net10_B
      targetFramework: 'net10.0'
      moduleShard: '2/2'
