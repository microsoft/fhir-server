# Unit tests for the Tier 1 PR path (validationMode tier1): the unit test projects are split in two shares by duration
# (build/test-shards/unit-tests.json), and each share is one job that builds only its projects and runs them without
# coverage. The stage depends on no other stage, so no job waits for the UpdateVersion stage or its semver.
stages:
# The repository targets net11.0 only (Directory.Build.props). The framework is a literal: variables.defaultBuildFramework
# (build-variables.yml) is not available while templates expand, so the job names and the -Framework argument would be empty.
- stage: BuildUnitTests
  displayName: 'Build and run unit tests'
  dependsOn: []
  jobs:
  - template: ../jobs/unit-tests-shard.yml
    parameters:
      jobName: UnitTests_net11_A
      targetFramework: 'net11.0'
      moduleShard: '1/2'
  - template: ../jobs/unit-tests-shard.yml
    parameters:
      jobName: UnitTests_net11_B
      targetFramework: 'net11.0'
      moduleShard: '2/2'
