# Lints a test-shard manifest (build/test-shards/<manifest>) against the E2E test applications: for each version it
# lists the tests with --list-tests, unfiltered and once per shard with the same trait filters, and checks that the
# shards together list exactly the unfiltered tests, that no test is in two shards, and that no shard is empty
# (build/scripts/Test-TestShards.ps1, which can also be run locally).
#
# Findings are warnings and the output variable ShardLintFailed=true; the job never fails. It is meant for shadow
# stages only: every step continues on error and the job is capped at 30 minutes.
parameters:
- name: versions
  type: object
  default: [Stu3, R4, R5]
- name: manifest
  type: string
  default: sql-e2e.json
# Trait filters shared by the unfiltered run and every shard; keep them equal to the filters of the sharded test runs.
- name: traitArgs
  type: object
  default: ['--filter-trait', 'DataStore=SqlServer', '--filter-not-trait', 'Category=ExportLongRunning']

jobs:
- job: ShardLint
  displayName: 'Shard lint (${{ parameters.manifest }})'
  timeoutInMinutes: 30
  pool:
    name: '$(InternalPool)'
    demands:
      - ImageOverride -equals $(InternalLinuxImage)
  steps:
  - checkout: self
    fetchDepth: 1
    fetchTags: false
    continueOnError: true

  - task: UseDotNet@2
    displayName: 'Use .NET SDK'
    continueOnError: true
    inputs:
      useGlobalJson: true

  - task: DownloadBuildArtifacts@0
    displayName: 'Download E2E tests'
    continueOnError: true
    inputs:
      buildType: 'current'
      downloadType: 'single'
      artifactName: 'IntegrationTests'
      itemPattern: 'IntegrationTests/Microsoft.Health.Fhir.*.Tests.E2E.zip'
      downloadPath: '$(System.ArtifactsDirectory)'

  - ${{ each version in parameters.versions }}:
    - task: ExtractFiles@1
      displayName: 'Extract ${{ version }} E2E tests'
      continueOnError: true
      inputs:
        archiveFilePatterns: '$(System.ArtifactsDirectory)/IntegrationTests/Microsoft.Health.Fhir.${{ version }}.Tests.E2E.zip'
        destinationFolder: '$(Agent.TempDirectory)/ShardLint/${{ version }}/'

  - pwsh: |
      $ErrorActionPreference = 'Continue'
      $manifest = Join-Path '$(Build.SourcesDirectory)' 'build/test-shards/${{ parameters.manifest }}'
      $lint = Join-Path '$(Build.SourcesDirectory)' 'build/scripts/Test-TestShards.ps1'
      $traitArgs = @($env:LINT_TRAIT_ARGS_JSON | ConvertFrom-Json)
      $anyFailed = $false

      foreach ($version in @($env:LINT_VERSIONS_JSON | ConvertFrom-Json)) {
        try {
          $name = "Microsoft.Health.Fhir.$version.Tests.E2E.dll"
          $dll = Get-ChildItem -Path (Join-Path '$(Agent.TempDirectory)' 'ShardLint' $version) -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            Write-Host "##vso[task.logissue type=warning]Shard lint ($version): could not find $name"
            $anyFailed = $true
            continue
          }

          $result = & $lint -TestExe $dll.FullName -Manifest $manifest -TraitArgs $traitArgs -Label $version -Pipeline
          Write-Host "$version`: $($result.UnfilteredCount) test(s); shards: $(($result.Shards | ForEach-Object { $_.Count }) -join ', ')"
          if (-not $result.Passed) { $anyFailed = $true }
        }
        catch {
          Write-Host "##vso[task.logissue type=warning]Shard lint ($version) failed: $($_.Exception.Message)"
          $anyFailed = $true
        }
      }

      # One value for the whole job: the per-version values set by the lint script are superseded here.
      Write-Host "##vso[task.setvariable variable=ShardLintFailed;isOutput=true]$("$anyFailed".ToLowerInvariant())"
      exit 0
    name: lint
    displayName: 'Lint test shards'
    continueOnError: true
    env:
      LINT_VERSIONS_JSON: ${{ convertToJson(parameters.versions) }}
      LINT_TRAIT_ARGS_JSON: ${{ convertToJson(parameters.traitArgs) }}
