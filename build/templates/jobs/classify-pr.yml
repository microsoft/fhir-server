# Classifies the PR's validation scope (lean, shared or full; build/scripts/Get-PrValidationScope.ps1 has the rules)
# and publishes it as output variables of step scope in job ClassifyPr:
#   ValidationScope         lean | shared | full
#   ScopeReasons            the rules that matched, '; '-separated (at most 20)
#   FullRequiresMaintainer  true when the scope is full and the run is a merge-queue run of a fork PR
# Reference them from another stage as dependencies.<stage>.outputs['ClassifyPr.scope.ValidationScope'], or from a job
# of another stage as stageDependencies.<stage>.ClassifyPr.outputs['scope.ValidationScope'].
#
# A PR run is classified by the scopePolicy parameter (draftFirst: a draft PR is lean unless labeled, a ready PR is
# full; paths: the path rules). Its draft state and labels come from one GitHub API call (pulls/<n>). Failing to read
# them does not fail the run: the labels are then unknown (ruling R16: classified without them, with a warning) and so
# is the draft state, which draftFirst treats as ready (full).
# Fails closed: any other failure (reading the changed files, the classifier) gives full, with the reason
# "fail-closed: <error>".
# A fork PR is always lean (the full matrix needs the deployed environments); a timeline warning says when the policy
# would have given full and how a maintainer runs it.
# A run that is not a pull request build is full, except that a manual run takes the scopeOverride parameter. A
# merge-queue run (refs/heads/gh-readonly-queue/...) is full by the classifier's rule, and needs a maintainer when the
# queued PR comes from a fork or its origin cannot be read from the GitHub API: job RequireMaintainer then fails the
# run and the deployed stages are skipped, which ejects the PR from the queue. This is routing, not a security
# boundary: the PR supplies this file and can edit it. The approval check on the privileged service connection is the
# gate (ADR-2611).
#
# Needs no service connection or secret. PR values (target branch, number) reach the script through env only.
parameters:
# auto classifies; lean, shared or full sets the scope, but only when Build.Reason is Manual, so the parameter default
# cannot downgrade a PR run.
- name: scopeOverride
  type: string
  default: 'auto'
  values:
  - 'auto'
  - 'lean'
  - 'shared'
  - 'full'
# How a PR run is classified (build/scripts/Get-PrValidationScope.ps1 -Policy): draftFirst (iteration 1 of the
# rollout, ADR-2611) or paths.
- name: scopePolicy
  type: string
  default: 'draftFirst'
  values:
  - 'draftFirst'
  - 'paths'
# Shadow jobs never fail the run.
- name: shadow
  type: boolean
  default: false

jobs:
- job: ClassifyPr
  displayName: 'Classify PR validation scope'
  timeoutInMinutes: 5
  ${{ if parameters.shadow }}:
    continueOnError: true
  pool:
    name: '$(InternalPool)'
    demands:
      - ImageOverride -equals $(InternalLinuxImage)
  steps:
  # The diff against the target branch needs its history (origin/<target>), so this is a full fetch.
  - checkout: self
    fetchDepth: 0
    fetchTags: false

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $isPullRequest = $env:BUILD_REASON -eq 'PullRequest'
      # System.PullRequest.* is read only in a PR run.
      $isFork = $isPullRequest -and $env:SYSTEM_PULLREQUEST_ISFORK -eq 'True'
      $override = $env:TIER1_SCOPE_OVERRIDE

      function New-Scope([string] $Scope, [string[]] $Reasons) {
        [pscustomobject]@{ Scope = $Scope; Reasons = $Reasons; FullRequiresMaintainer = ($Scope -eq 'full' -and $isFork); Warnings = @(); Advisory = '' }
      }

      try {
        if ($env:BUILD_REASON -eq 'Manual' -and $override -ne 'auto') {
          $result = New-Scope $override @("override: tier1Scope=$override (manual run)")
        }
        elseif (-not $isPullRequest) {
          if ($override -ne 'auto') { Write-Host "tier1Scope=$override ignored: only manual runs take an override." }

          # A merge-queue run (gh-readonly-queue/<base>/pr-<n>-<sha>) is a CI build of this repository, so ADO's fork
          # protection does not cover it. A queued fork PR, or one whose origin cannot be read, needs a maintainer,
          # which routes the run away from the deployed stages. Routing only: the queue branch carries the PR's own
          # build/ files; the approval check on the privileged service connection is the gate
          # (docs/ci/full-test-matrix.md).
          if ($env:BUILD_SOURCEBRANCH -match '^refs/heads/gh-readonly-queue/.+/pr-(\d+)-[0-9a-f]+$') {
            $number = $Matches[1]
            try {
              $pr = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/fhir-server/pulls/$number" `
                -Headers @{ Accept = 'application/vnd.github+json' } -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
              $isFork = $pr.head.repo.full_name -ne 'microsoft/fhir-server'
              Write-Host "Queued PR #$number head repository: $($pr.head.repo.full_name)"
            }
            catch {
              $isFork = $true
              Write-Host "##vso[task.logissue type=warning]Could not read PR #$number, so it is treated as a fork PR: $($_.Exception.Message -replace '[\r\n]+', ' ')"
            }
          }

          # No PR: no target branch to diff against and no labels. The classifier makes a merge-queue branch full; any
          # other run that is not a pull request is full too, failing closed.
          $files = @(git -c core.quotePath=false diff --no-renames --name-only HEAD~1...HEAD)
          if ($LASTEXITCODE -ne 0) { throw "git diff --no-renames --name-only HEAD~1...HEAD exited with $LASTEXITCODE" }
          Write-Host "$($files.Count) files changed by the last commit."
          $result = & "$env:BUILD_SOURCESDIRECTORY/build/scripts/Get-PrValidationScope.ps1" -Policy paths `
            -ChangedFiles $files -SourceBranch $env:BUILD_SOURCEBRANCH -IsFork $isFork
          if ($result.Scope -ne 'full') {
            $result = New-Scope 'full' @("not a pull request (Build.Reason=$env:BUILD_REASON)")
          }
        }
        else {
          if ($override -ne 'auto') { Write-Host "tier1Scope=$override ignored: only manual runs take an override." }

          $target = $env:SYSTEM_PULLREQUEST_TARGETBRANCH -replace '^refs/heads/', ''
          if (-not $target) { throw 'System.PullRequest.TargetBranch is empty' }

          $files = @(git -c core.quotePath=false diff --no-renames --name-only "origin/$target...HEAD")
          if ($LASTEXITCODE -ne 0) { throw "git diff --no-renames --name-only origin/$target...HEAD exited with $LASTEXITCODE" }
          Write-Host "$($files.Count) changed files against origin/$target."

          # The root Directory.Packages.props is classified by the packages (and version properties) it changes.
          $packages = @()
          $packageProperties = @()
          if ($files -contains 'Directory.Packages.props') {
            $packageDiff = @(git diff -U0 "origin/$target...HEAD" -- Directory.Packages.props)
            if ($LASTEXITCODE -ne 0) { throw "git diff -U0 origin/$target...HEAD -- Directory.Packages.props exited with $LASTEXITCODE" }
            $propsPath = "$env:BUILD_SOURCESDIRECTORY/Directory.Packages.props"
            $content = if (Test-Path -LiteralPath $propsPath) { @(Get-Content -LiteralPath $propsPath) } else { @() }
            $changes = & "$env:BUILD_SOURCESDIRECTORY/build/scripts/Get-PackagePropsChanges.ps1" -DiffLines $packageDiff -Content $content
            $packages = @($changes.Packages)
            $packageProperties = @($changes.Properties)
            Write-Host "Changed packages: $($packages -join ', '). Changed properties: $($packageProperties -join ', ')."
          }

          # The draft state and the labels, from one call; fork PRs too, for the warning that says what full would
          # have run for. A failure to read them (HTTP error, timeout, rate limit) does not fail closed: both are then
          # unknown, and the classifier treats an unknown draft state as ready for review.
          $labels = @()
          $labelsUnavailableReason = ''
          $isDraft = $null
          try {
            $number = $env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER
            if ($number -notmatch '^\d+$') { throw "System.PullRequest.PullRequestNumber '$number' is not a number" }
            $pr = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/fhir-server/pulls/$number" `
              -Headers @{ Accept = 'application/vnd.github+json' } -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
            $labels = @($pr.labels | ForEach-Object { $_.name })
            if ($pr.draft -is [bool]) { $isDraft = $pr.draft }
            Write-Host "Draft: $(if ($null -eq $isDraft) { 'unknown' } else { $isDraft }). Labels: $($labels -join ', ')"
          }
          catch {
            $labelsUnavailableReason = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Host "Could not read PR #$number from the GitHub API: $labelsUnavailableReason"
          }

          $result = & "$env:BUILD_SOURCESDIRECTORY/build/scripts/Get-PrValidationScope.ps1" -Policy $env:TIER1_SCOPE_POLICY `
            -ChangedFiles $files -Labels $labels -IsDraft $isDraft -TargetBranch $target -IsFork $isFork `
            -LabelsUnavailableReason $labelsUnavailableReason -ChangedPackages $packages -ChangedPackageProperties $packageProperties
        }
      }
      catch {
        $reason = "fail-closed: $($_.Exception.Message -replace '[\r\n]+', ' ')"
        # A fork PR stays lean: the full matrix never runs for it.
        if ($isPullRequest -and $isFork) {
          $result = New-Scope 'lean' @('fork PR: Tier 1 only')
          $result.Warnings = @("Fork PR: full test matrix not run ($reason). A maintainer can push the reviewed SHA to a branch in microsoft/fhir-server to run it.")
        }
        else {
          $result = New-Scope 'full' @($reason)
        }
      }

      $result.Warnings | ForEach-Object { Write-Host "##vso[task.logissue type=warning]$_" }
      if ($result.Advisory) { Write-Host ($result.Advisory -replace '[\r\n]+', ' ') }

      $reasons = @($result.Reasons | ForEach-Object { $_ -replace '[\r\n]+', ' ' })
      $published = @($reasons | Select-Object -First 20)
      if ($reasons.Count -gt 20) {
        $published += "(+$($reasons.Count - 20) more)"
        Write-Host '##[group]All reasons'
        $reasons | ForEach-Object { Write-Host $_ }
        Write-Host '##[endgroup]'
      }
      Write-Host "Scope=$($result.Scope) Reasons=$($published -join '; ')"
      $frm = "$($result.FullRequiresMaintainer)".ToLowerInvariant()
      Write-Host "##vso[task.setvariable variable=ValidationScope;isOutput=true]$($result.Scope)"
      Write-Host "##vso[task.setvariable variable=ScopeReasons;isOutput=true]$($published -join '; ')"
      Write-Host "##vso[task.setvariable variable=FullRequiresMaintainer;isOutput=true]$frm"
    name: scope
    displayName: 'Classify validation scope'
    env:
      TIER1_SCOPE_OVERRIDE: ${{ parameters.scopeOverride }}
      TIER1_SCOPE_POLICY: ${{ parameters.scopePolicy }}

# Only a merge-queue run of a fork PR gets here: a fork PR's own runs are lean.
- job: RequireMaintainer
  displayName: 'Queued fork PR needs a maintainer for the full matrix'
  dependsOn: ClassifyPr
  condition: and(succeeded(), eq(dependencies.ClassifyPr.outputs['scope.FullRequiresMaintainer'], 'true'))
  timeoutInMinutes: 5
  ${{ if parameters.shadow }}:
    continueOnError: true
  pool:
    name: '$(InternalPool)'
    demands:
      - ImageOverride -equals $(InternalLinuxImage)
  steps:
  - checkout: none
  - pwsh: |
      Write-Host "##vso[task.logissue type=error]This merge-queue run is of a fork PR (or one whose origin could not be read), and the queue runs the full Azure matrix. A maintainer must push the reviewed SHA to a branch in microsoft/fhir-server and run it there (ADR-2611, Tier 2)."
      exit 1
    displayName: 'Require a maintainer'
