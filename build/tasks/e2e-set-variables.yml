parameters:
- name: containerAppName
  type: string
- name: version
  type: string
- name: appServiceType
  type: string
- name: expectedFhirSdkProviderSystemDefault
  type: string
  default: ''
- name: expectedKeyVaultName
  type: string
  default: ''
- name: expectedSqlDatabaseName
  type: string
  default: ''

steps:
- task: AzurePowerShell@5
  displayName: 'Set Variables (ACA)'
  # Recover from transient Connect-AzAccount failures before the read-only script runs.
  retryCountOnTaskFailure: 1
  inputs:
    azureSubscription: $(ConnectedServiceName)
    azurePowerShellVersion: latestVersion
    pwsh: true
    ScriptType: InlineScript
    Inline: |
        function Set-SecretsAsPipelineVariables {
            param(
                [Parameter(Mandatory = $true)]
                [string]$VaultName
            )

            $secrets = Get-AzKeyVaultSecret -VaultName $VaultName
            foreach ($secret in $secrets) {
                $environmentVariableName = $secret.Name.Replace("--", "_")

                $secretValue = Get-AzKeyVaultSecret -VaultName $VaultName -Name $secret.Name
                # Replace with -AsPlainText flag when v5.3 of the Az Module is supported
                $plainValue = ([System.Net.NetworkCredential]::new("", $secretValue.SecretValue).Password).ToString()
                if ([string]::IsNullOrEmpty($plainValue)) {
                    throw "$($secret.Name) is empty"
                }

                # Secret variables are masked by Azure Pipelines when later tasks reference them.
                Write-Host "##vso[task.setvariable variable=$($environmentVariableName);issecret=true]$($plainValue)"
            }
        }

        function Get-ContainerEnvValue {
            param(
                [Parameter(Mandatory = $true)]
                [array]$EnvSettings,
                [Parameter(Mandatory = $true)]
                [string]$Name
            )

            $setting = $EnvSettings | Where-Object { $_.name -eq $Name } | Select-Object -First 1
            if ($null -eq $setting) {
                return $null
            }

            if ($null -ne $setting.value) {
                return [string]$setting.value
            }

            return $null
        }

        $fhirSdkProviderSeams = @('', 'SystemDefault', 'FhirPath', 'Import')

        function Assert-FhirSdkProviderConfiguration {
            param(
                [Parameter(Mandatory = $true)]
                [AllowEmptyCollection()]
                [array]$EnvSettings,
                [Parameter(Mandatory = $true)]
                [hashtable]$SecretValues,
                [Parameter(Mandatory = $true)]
                [string]$ExpectedProvider,
                [Parameter(Mandatory = $true)]
                [string]$ContainerAppName
            )

            # Configuration keys are case-insensitive, so match names the same way the app does.
            $envPrefix = 'FhirServer__CoreFeatures__FhirSdkProvider'
            $envProviderSettings = @($EnvSettings | Where-Object { $_.name -ieq $envPrefix -or $_.name -ilike "${envPrefix}__*" })

            $duplicate = $envProviderSettings | Group-Object { $_.name.ToUpperInvariant() } | Where-Object Count -gt 1 | Select-Object -First 1
            if ($duplicate) {
                throw "Container App '$ContainerAppName' defines '$($duplicate.Group[0].name)' more than once."
            }

            # The app refuses to start with the old single-value form, so report it here with a clear cause.
            $legacySettings = @($envProviderSettings | Where-Object { $_.name -ieq $envPrefix } | ForEach-Object { "$($_.name) (environment)" })
            $legacySettings += @($SecretValues.Keys | Where-Object { $_ -ieq 'FhirServer--CoreFeatures--FhirSdkProvider' } | ForEach-Object { "$_ (Key Vault)" })
            if ($legacySettings.Count -gt 0) {
                throw "Container App '$ContainerAppName' sets the unsupported single-value FhirSdkProvider setting: $($legacySettings -join ', '). Use FhirSdkProvider__SystemDefault."
            }

            $unknownSettings = @($envProviderSettings | Where-Object { $_.name -ilike "${envPrefix}__*" -and $_.name.Substring($envPrefix.Length + 2) -notin $fhirSdkProviderSeams.Where({ $_ }) })
            if ($unknownSettings.Count -gt 0) {
                throw "Container App '$ContainerAppName' sets unsupported FhirSdkProvider settings: $(($unknownSettings | ForEach-Object name) -join ', ')."
            }

            if (-not ($envProviderSettings | Where-Object { $_.name -ieq "${envPrefix}__SystemDefault" })) {
                throw "Container App '$ContainerAppName' must define FhirSdkProvider__SystemDefault='$ExpectedProvider'."
            }

            # SystemDefault and every per-seam override can each decide a seam's provider.
            # Requiring all of them to match means no precedence order can select a different provider.
            $settings = @($envProviderSettings | ForEach-Object { [pscustomobject]@{ Name = $_.name; Value = [string]$_.value; Source = 'environment' } })
            $settings += @($SecretValues.GetEnumerator() | ForEach-Object { [pscustomobject]@{ Name = $_.Key; Value = [string]$_.Value; Source = 'Key Vault' } })
            $conflicts = @($settings | Where-Object { $_.Value.Trim() -ine $ExpectedProvider })
            if ($conflicts.Count -gt 0) {
                $details = ($conflicts | ForEach-Object { "$($_.Name)='$($_.Value)' ($($_.Source))" }) -join ', '
                throw "Container App '$ContainerAppName' must resolve every FHIR SDK provider setting to '$ExpectedProvider'. Conflicting settings: $details."
            }

            return $ExpectedProvider
        }

        function Set-TestEnvironmentUrlVariables {
            param(
                [Parameter(Mandatory = $true)]
                [psobject]$ContainerAppData,
                [Parameter(Mandatory = $true)]
                [string]$Version,
                [Parameter(Mandatory = $true)]
                [string]$AppServiceType
            )

            $fqdn = $ContainerAppData.Properties.configuration.ingress.fqdn
            if ([string]::IsNullOrEmpty($fqdn) -or $fqdn -eq 'null') {
                throw "Container App '$containerAppName' does not have an ingress FQDN configured."
            }

            $url = "https://$fqdn"
            if ($AppServiceType -eq 'SqlServer') {
                $defaultVariableName = 'TestEnvironmentUrl_Sql'
                $versionVariableName = "TestEnvironmentUrl_${Version}_Sql"
            }
            else {
                $defaultVariableName = 'TestEnvironmentUrl'
                $versionVariableName = "TestEnvironmentUrl_$Version"
            }

            Write-Host "Resolved ACA URL for $AppServiceType/$($Version): $url"
            Write-Host "Setting pipeline variables '$defaultVariableName' and '$versionVariableName'"
            Write-Host "##vso[task.setvariable variable=$defaultVariableName]$url"
            Write-Host "##vso[task.setvariable variable=$versionVariableName]$url"
        }

        $keyVault = "$(KeyVaultBaseName)-ts"
        Set-SecretsAsPipelineVariables -VaultName $keyVault

        $containerAppName = "${{ parameters.containerAppName }}"
        $containerApp = Get-AzResource -ResourceGroupName $(UniqueResourceGroupName) -ResourceType "Microsoft.App/containerApps" -Name $containerAppName -ApiVersion "2023-05-01" -ExpandProperties
        if ($null -eq $containerApp) {
            throw "Container App '$containerAppName' was not found in resource group '$(UniqueResourceGroupName)'"
        }

        $containerAppData = $containerApp | ConvertTo-Json -Depth 100 | ConvertFrom-Json
        $envSettings = $containerAppData.Properties.template.containers[0].env
        if ($null -eq $envSettings) {
            throw "Container App '$containerAppName' has no environment variables configured."
        }

        $expectedFhirSdkProviderSystemDefault = '${{ parameters.expectedFhirSdkProviderSystemDefault }}'
        if ($expectedFhirSdkProviderSystemDefault) {
            # The app reads environment variables, then Key Vault secrets (Program.cs), so a Key Vault value
            # wins. Read every setting that can change the effective FHIRPath provider from both sources.
            $providerSecretValues = @{}
            $providerVaultEndpoint = Get-ContainerEnvValue -EnvSettings $envSettings -Name 'KeyVault__Endpoint'
            if ($providerVaultEndpoint) {
                $providerVaultName = ([uri]$providerVaultEndpoint).Host.Split('.')[0]
                foreach ($seam in $fhirSdkProviderSeams) {
                    $secretName = if ($seam) { "FhirServer--CoreFeatures--FhirSdkProvider--$seam" } else { 'FhirServer--CoreFeatures--FhirSdkProvider' }
                    try {
                        $secretValue = Get-AzKeyVaultSecret -VaultName $providerVaultName -Name $secretName -AsPlainText -ErrorAction Stop
                    }
                    catch {
                        if ($_.Exception.Message -notmatch 'NotFound|not found|SecretNotFound') {
                            throw "Could not read '$secretName' from Key Vault '$providerVaultName' to verify the FHIR SDK provider: $($_.Exception.Message)"
                        }
                        $secretValue = $null
                    }
                    if ($null -ne $secretValue) {
                        $providerSecretValues[$secretName] = [string]$secretValue
                    }
                }
            }

            $effectiveFhirPathProvider = Assert-FhirSdkProviderConfiguration `
                -EnvSettings $envSettings `
                -SecretValues $providerSecretValues `
                -ExpectedProvider $expectedFhirSdkProviderSystemDefault `
                -ContainerAppName $containerAppName
            Write-Host "Container App '$containerAppName' effective FHIRPath provider: $effectiveFhirPathProvider"
        }

        $expectedSqlDatabaseName = '${{ parameters.expectedSqlDatabaseName }}'
        if ($expectedSqlDatabaseName) {
            $expectedKeyVaultName = '${{ parameters.expectedKeyVaultName }}'
            $vaultEndpoint = Get-ContainerEnvValue -EnvSettings $envSettings -Name 'KeyVault__Endpoint'
            $vaultDnsSuffix = (Get-AzEnvironment -Name (Get-AzContext -ErrorAction Stop).Environment.Name -ErrorAction Stop).AzureKeyVaultDnsSuffix.Trim('.')
            if (-not $expectedKeyVaultName -or -not $vaultEndpoint -or $vaultEndpoint.TrimEnd('/') -ine "https://$expectedKeyVaultName.$vaultDnsSuffix") {
                throw "Container App '$containerAppName' must use the expected Key Vault '$expectedKeyVaultName'."
            }
            try {
                $connectionString = Get-AzKeyVaultSecret -VaultName $expectedKeyVaultName -Name 'SqlServer--ConnectionString' -AsPlainText -ErrorAction Stop
                $connection = [System.Data.Common.DbConnectionStringBuilder]::new()
                $connection.set_ConnectionString($connectionString)
            }
            catch {
                throw "Could not read the SQL connection configuration from Key Vault '$expectedKeyVaultName'."
            }
            $databaseName = if ($connection.ContainsKey('Initial Catalog')) { $connection['Initial Catalog'] } else { $connection['Database'] }
            if ($databaseName -ine $expectedSqlDatabaseName) {
                throw "Container App '$containerAppName' must target SQL database '$expectedSqlDatabaseName'."
            }
        }

        Set-TestEnvironmentUrlVariables -ContainerAppData $containerAppData -Version '${{ parameters.version }}' -AppServiceType '${{ parameters.appServiceType }}'

        $acrLoginServer = Get-ContainerEnvValue -EnvSettings $envSettings -Name "FhirServer__Operations__ConvertData__ContainerRegistryServers__0"

        $exportStoreUri = Get-ContainerEnvValue -EnvSettings $envSettings -Name "FhirServer__Operations__Export__StorageAccountUri"
        if ([string]::IsNullOrEmpty($exportStoreUri) -or $exportStoreUri -eq "null") {
            throw "FhirServer__Operations__Export__StorageAccountUri is missing on container app '$containerAppName'."
        }
        Write-Host "$exportStoreUri"
        Write-Host "##vso[task.setvariable variable=TestExportStoreUri]$($exportStoreUri)"

        $integrationStoreUri = Get-ContainerEnvValue -EnvSettings $envSettings -Name "FhirServer__Operations__IntegrationDataStore__StorageAccountUri"
        if ([string]::IsNullOrEmpty($integrationStoreUri) -or $integrationStoreUri -eq "null") {
            throw "FhirServer__Operations__IntegrationDataStore__StorageAccountUri is missing on container app '$containerAppName'."
        }
        Write-Host "$integrationStoreUri"
        Write-Host "##vso[task.setvariable variable=TestIntegrationStoreUri]$($integrationStoreUri)"

        if (-not [string]::IsNullOrEmpty($acrLoginServer) -and $acrLoginServer -ne "null") {
            Write-Host "ACA convert-data registry server: $acrLoginServer"
            Write-Host "##vso[task.setvariable variable=TestContainerRegistryServer]$acrLoginServer"
        }
        else {
            Write-Host "##vso[task.setvariable variable=TestContainerRegistryServer]"
        }

        Write-Host "##vso[task.setvariable variable=Resource]$(TestApplicationResource)"
        Write-Host "##vso[task.setvariable variable=TestTokenEndpoint]https://login.microsoftonline.com/$(tenant-id-guid)/oauth2/token"

        Set-SecretsAsPipelineVariables -VaultName resolute-oss-tenant-info

        dotnet dev-certs https

        Write-Host "##vso[task.setvariable variable=AZURESUBSCRIPTION_CLIENT_ID]$env:AZURESUBSCRIPTION_CLIENT_ID"
        Write-Host "##vso[task.setvariable variable=AZURESUBSCRIPTION_TENANT_ID]$env:AZURESUBSCRIPTION_TENANT_ID"
        Write-Host "##vso[task.setvariable variable=AZURESUBSCRIPTION_SERVICE_CONNECTION_ID]$env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"
