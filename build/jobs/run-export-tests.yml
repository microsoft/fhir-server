parameters:
- name: version
  type: string
- name: keyVaultName
  type: string
- name: cosmosContainerAppName
  type: string
- name: sqlContainerAppName
  type: string

jobs:
- job: 'cosmosE2eTests'
  dependsOn: []
  pool:
    name: '$(InternalPool)'
    demands:
      - ImageOverride -equals $(InternalLinuxImage)
  variables:
    AllowPtrToDetectTestRunRetryFiles: true
  steps:
  - template: e2e-setup.yml
  - template: e2e-tests-extract.yml
    parameters:
      version: ${{parameters.version}}

  - task: AzurePowerShell@5
    displayName: 'Resolve ACA FQDN (Cosmos)'
    inputs:
      azureSubscription: $(ConnectedServiceName)
      azurePowerShellVersion: latestVersion
      pwsh: true
      ScriptType: inlineScript
      Inline: |
        $containerAppName = "${{ parameters.cosmosContainerAppName }}".ToLowerInvariant()
        $containerApp = Get-AzResource -ResourceGroupName $(ResourceGroupName) -ResourceType "Microsoft.App/containerApps" -Name $containerAppName -ApiVersion "2023-05-01" -ExpandProperties
        if ($null -eq $containerApp) {
            throw "Container App '$containerAppName' not found in resource group '$(ResourceGroupName)'"
        }
        $fqdn = $containerApp.Properties.configuration.ingress.fqdn
        $url = "https://$fqdn"
        Write-Host "Resolved Cosmos ACA URL: $url"
        Write-Host "##vso[task.setvariable variable=TestEnvironmentUrl]$url"
        Write-Host "##vso[task.setvariable variable=TestEnvironmentUrl_${{ parameters.version }}]$url"

  - task: AzurePowerShell@5
    displayName: 'Set Variables'
    inputs:
      azureSubscription: $(ConnectedServiceName)
      azurePowerShellVersion: latestVersion
      pwsh: true
      ScriptType: inlineScript
      Inline: |
        $keyVault = "$(KeyVaultBaseName)-ts"
        $secrets = Get-AzKeyVaultSecret -VaultName $keyVault
        
        foreach($secret in $secrets)
        {
            $environmentVariableName = $secret.Name.Replace("--","_")

            $secretValue = Get-AzKeyVaultSecret -VaultName $keyVault -Name $secret.Name
            # Replace with -AsPlainText flag when v5.3 of the Az Module is supported
            $plainValue = ([System.Net.NetworkCredential]::new("", $secretValue.SecretValue).Password).ToString()
            if([string]::IsNullOrEmpty($plainValue))
            {
                throw "$($secret.Name) is empty"
            }
            Write-Host "##vso[task.setvariable variable=$($environmentVariableName)]$($plainValue)"
        }


        Write-Host "##vso[task.setvariable variable=Resource]$(TestEnvironmentUrl)"
        
        $secrets = Get-AzKeyVaultSecret -VaultName resolute-oss-tenant-info
 
        foreach($secret in $secrets)
        {
            $environmentVariableName = $secret.Name.Replace("--","_")

            $secretValue = Get-AzKeyVaultSecret -VaultName resolute-oss-tenant-info -Name $secret.Name
            # Replace with -AsPlainText flag when v5.3 of the Az Module is supported
            $plainValue = ([System.Net.NetworkCredential]::new("", $secretValue.SecretValue).Password).ToString()
            if([string]::IsNullOrEmpty($plainValue))
            {
                throw "$($secret.Name) is empty"
            }
            Write-Host "##vso[task.setvariable variable=$($environmentVariableName)]$($plainValue)"
        }
        # ----------------------------------------

        dotnet dev-certs https

  - task: PowerShell@2
    displayName: 'Export E2E ${{ parameters.version }} CosmosDB'
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $testRoot = "$(Agent.TempDirectory)/E2ETests"
        $testName = "Microsoft.Health.Fhir.${{ parameters.version }}.Tests.E2E"
        $dll = Get-ChildItem -Path $testRoot -Recurse -Filter "$testName.dll" | Select-Object -First 1
        if (-not $dll) {
          throw "Could not find $testName.dll under $testRoot"
        }

        # Positive on DataStore, so a case missing that trait is invisible here rather than failing.
        # The floor makes a filter or trait regression that empties this leg fail instead of pass.
        $args = @('--filter-query', '/[(DataStore=CosmosDb)&(Category=ExportLongRunning)]', '--parallel', 'none', '--retry-failed-tests', '3', '--report-trx', '--minimum-expected-tests', '1')

        Write-Host "Running dotnet $($dll.FullName) with filter: /[(DataStore=CosmosDb)&(Category=ExportLongRunning)]"
        & dotnet $dll.FullName @args

        if ($LASTEXITCODE -ne 0) {
          throw "E2E tests failed with exit code $LASTEXITCODE"
        }
    env:
      'TestEnvironmentUrl': $(TestEnvironmentUrl)
      'TestEnvironmentUrl_${{ parameters.version }}': $(TestEnvironmentUrl_${{ parameters.version }})
      'Resource': $(Resource)
      'AllStorageAccounts': $(AllStorageAccounts)
      'tenant-admin-service-principal-name': $(tenant-admin-service-principal-name)
      'tenant-admin-service-principal-password': $(tenant-admin-service-principal-password)
      'tenant-admin-user-name': $(tenant-admin-user-name)
      'tenant-admin-user-password': $(tenant-admin-user-password)
      'tenant-id': $(tenant-id)
      'app_globalAdminServicePrincipal_id': $(app_globalAdminServicePrincipal_id)
      'app_globalAdminServicePrincipal_secret': $(app_globalAdminServicePrincipal_secret)
      'app_nativeClient_id': $(app_nativeClient_id)
      'app_nativeClient_secret': $(app_nativeClient_secret)
      'app_wrongAudienceClient_id': $(app_wrongAudienceClient_id)
      'app_wrongAudienceClient_secret': $(app_wrongAudienceClient_secret)
      'app_globalAdminUserApp_id': $(app_globalAdminUserApp_id)
      'app_globalAdminUserApp_secret': $(app_globalAdminUserApp_secret)
      'app_globalConverterUserApp_id': $(app_globalConverterUserApp_id)
      'app_globalConverterUserApp_secret': $(app_globalConverterUserApp_secret)
      'app_globalExporterUserApp_id': $(app_globalExporterUserApp_id)
      'app_globalExporterUserApp_secret': $(app_globalExporterUserApp_secret)
      'app_globalImporterUserApp_id': $(app_globalImporterUserApp_id)
      'app_globalImporterUserApp_secret': $(app_globalImporterUserApp_secret)
      'app_globalReaderUserApp_id': $(app_globalReaderUserApp_id)
      'app_globalReaderUserApp_secret': $(app_globalReaderUserApp_secret)
      'app_globalWriterUserApp_id': $(app_globalWriterUserApp_id)
      'app_globalWriterUserApp_secret': $(app_globalWriterUserApp_secret)    
      platformOptions__resultDirectory: '$(Agent.TempDirectory)/testresults'

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(Agent.TempDirectory)/testresults/**/*.trx'
      mergeTestResults: true
      testRunTitle: 'Export ${{ parameters.version }} CosmosDB'
      # --retry-failed-tests re-runs the failures in a fresh process and writes one TRX per
      # attempt under Retries/<id>/<n>/, all of which this glob matches. Attempt 1 therefore
      # keeps a Failed record for a test that later passed, and mergeTestResults does not
      # resolve the two, so failing the task on published results would cancel out every
      # retry. The runner's exit code is the retry-aware verdict -- 0 once an attempt passes,
      # non-zero when they are exhausted -- and the step that runs the tests already fails on
      # it, so the attempts are published for visibility only.
      failTaskOnFailedTests: false
      # A missing TRX means the run reported nothing; without this the publish step
      # succeeds silently and there is nothing to notice.
      failTaskOnMissingResultsFile: true
    condition: succeededOrFailed()

