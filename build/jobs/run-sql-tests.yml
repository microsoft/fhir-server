parameters:
- name: version
  type: string
- name: keyVaultName
  type: string
- name: containerAppName
  type: string
- name: isolationContainerAppName
  type: string
  default: ''
- name: integrationSqlServerName
  type: string
- name: mainCategoryFilter
  type: string
  default: '(Category!=ExportLongRunning)&(Category!=ImportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)&(Category!=BulkDelete)'
- name: runShardedIntegrationTests
  type: boolean
  default: false
- name: integrationTestShards
  type: object
  # SqlVariants owns fixture variants; SqlSpecific owns SQL-named classes without that trait.
  default:
    - name: General
      filterArguments:
        - '--filter-not-trait'
        - 'Category=SmartOnFhir'
        - 'Category=IndexAndReindex'
        - 'Category=Search'
        - 'Category=SearchParameterStatus'
        - 'DataStore=SqlServer'
        - '--filter-not-class'
        - '*SqlServer*'
        - '*SqlComplex*'
        - '*SqlDataReader*'
        - '*SqlRetry*'
        - '*QueryPlanReuseChecker*'
        - '*QueueClient*'
        - '*ExpiredResourceCleanupWatchdog*'
        - '*SearchParameterOptimisticConcurrency*'
    - name: SmartSearch
      filterArguments: ['--filter-trait', 'Category=SmartOnFhir']
    - name: Search
      filterArguments: ['--filter-trait', 'Category=Search', 'Category=SearchParameterStatus', '--filter-not-trait', 'Category=SmartOnFhir']
    - name: Reindex
      filterArguments: ['--filter-trait', 'Category=IndexAndReindex']
    - name: SqlVariants
      filterArguments:
        - '--filter-trait'
        - 'DataStore=SqlServer'
        - '--filter-not-trait'
        - 'Category=IndexAndReindex'
        - 'Category=Search'
        - 'Category=SearchParameterStatus'
        - 'Category=SmartOnFhir'
    - name: SqlSpecific
      filterArguments:
        - '--filter-class'
        - '*SqlServer*'
        - '*SqlComplex*'
        - '*SqlDataReader*'
        - '*SqlRetry*'
        - '*QueryPlanReuseChecker*'
        - '*QueueClient*'
        - '*ExpiredResourceCleanupWatchdog*'
        - '*SearchParameterOptimisticConcurrency*'
        - '--filter-not-trait'
        - 'DataStore=SqlServer'
        - 'Category=IndexAndReindex'
        - 'Category=Search'
        - 'Category=SearchParameterStatus'
        - 'Category=SmartOnFhir'
- name: runShardedE2eJobs
  type: boolean
  default: false
- name: e2eTestShards
  type: object
  # Shard names must be valid Azure Pipelines job identifiers. Tests tagged RequiresIsolation run in a terminal lane below.
  # mainCategoryFilter default is inlined here because ADO does not allow ${{ parameters.x }} in object parameter defaults.
  default:
    - name: General
      categoryFilter: '(Category!=ExportLongRunning)&(Category!=ImportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)&(Category!=BulkUpdate)&(Category!=BulkDelete)&(Category!=CustomSearch)&(Category!=History)&(Category!=Import)&(Category!=Search)&(Category!=Sort)&(Category!=CompartmentSearch)&(Category!=ConditionalOperations)&(Category!=Patch)&(Category!=Bundle)&(Category!=BundleTransaction)'
    - name: Search
      categoryFilter: '(Category!=ExportLongRunning)&(Category!=ImportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)&(Category!=BulkUpdate)&((Category=Search)|(Category=Sort)|(Category=CompartmentSearch))&(Category!=CustomSearch)&(Category!=BundleTransaction)'
    - name: Import
      categoryFilter: '(Category!=ExportLongRunning)&(Category!=ImportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)&(Category!=BulkUpdate)&(Category=Import)'
    - name: Mutation
      categoryFilter: '(Category!=ExportLongRunning)&(Category!=ImportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)&(Category!=BulkUpdate)&((Category=ConditionalOperations)|(Category=Patch)|(Category=Bundle)|(Category=BundleTransaction))'
    - name: BulkUpdate
      categoryFilter: 'Category=BulkUpdate'
    - name: History
      categoryFilter: '(Category!=ExportLongRunning)&(Category!=ImportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)&(Category!=BulkUpdate)&(Category=History)'
- name: runReindexJob
  type: boolean
  default: true
- name: runBulkUpdateJob
  type: boolean
  default: true
- name: integrationParallelizeTestCollections
  type: boolean
  default: false
- name: e2eParallelizeTestCollections
  type: boolean
  default: false
jobs:

- ${{ if eq(parameters.runShardedIntegrationTests, false) }}:
  - job: "SqlIntegrationTests"
    timeoutInMinutes: 75
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    variables:
      AllowPtrToDetectTestRunRetryFiles: true
    steps:
    - checkout: self
      fetchDepth: 1
      fetchTags: false
      path: source

    - template: integration-setup.yml

    - template: integration-tests-extract.yml
      parameters:
        version: ${{ parameters.version }}

    - template: integration-tests-run.yml
      parameters:
        version: ${{ parameters.version }}
        dataStore: 'Sql'
        keyVaultName: '${{ parameters.keyVaultName }}'
        filterArguments: []
        testRunTitle: '${{ parameters.version }} SQL Integration Tests'
        artifactSuffix: 'Sql_${{ parameters.version }}'
        integrationSqlServerName: '${{ parameters.integrationSqlServerName }}'
        parallelizeTestCollections: ${{ parameters.integrationParallelizeTestCollections }}

- ${{ if eq(parameters.runShardedIntegrationTests, true) }}:
  - ${{ each shard in parameters.integrationTestShards }}:
    - ${{ if or(ne(shard.name, 'SmartSearch'), or(eq(parameters.version, 'R4'), eq(parameters.version, 'R4B'))) }}:
      - job: 'SqlIntegrationTests_${{ shard.name }}'
        timeoutInMinutes: 75
        pool:
          name: '$(InternalPool)'
          demands:
            - ImageOverride -equals $(InternalLinuxImage)
        variables:
          AllowPtrToDetectTestRunRetryFiles: true
        steps:
        - checkout: self
          fetchDepth: 1
          fetchTags: false
          path: source

        - template: integration-setup.yml

        - template: integration-tests-extract.yml
          parameters:
            version: ${{ parameters.version }}

        - template: integration-tests-run.yml
          parameters:
            version: ${{ parameters.version }}
            dataStore: 'Sql'
            keyVaultName: '${{ parameters.keyVaultName }}'
            filterArguments: ${{ shard.filterArguments }}
            testRunTitle: '${{ parameters.version }} SQL Integration Tests ${{ shard.name }}'
            artifactSuffix: 'Sql_${{ parameters.version }}_${{ shard.name }}'
            integrationSqlServerName: '${{ parameters.integrationSqlServerName }}'
            parallelizeTestCollections: ${{ parameters.integrationParallelizeTestCollections }}

- ${{ if eq(parameters.runShardedE2eJobs, false) }}:
  - job: 'sqlE2eTests'
    timeoutInMinutes: 120
    dependsOn: []
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    variables:
      AllowPtrToDetectTestRunRetryFiles: true
    steps:
    - template: e2e-setup.yml
    - template: e2e-tests.yml
      parameters:
        version: ${{ parameters.version }}
        containerAppName: '${{ parameters.containerAppName }}'
        appServiceType: 'SqlServer'
        categoryFilter: '${{ parameters.mainCategoryFilter }}'
        parallelizeTestCollections: ${{ parameters.e2eParallelizeTestCollections }}

- ${{ if eq(parameters.runShardedE2eJobs, true) }}:
  - ${{ each shard in parameters.e2eTestShards }}:
    - job: 'sqlE2eTests_${{ shard.name }}'
      timeoutInMinutes: 120
      dependsOn: []
      pool:
        name: '$(InternalPool)'
        demands:
          - ImageOverride -equals $(InternalLinuxImage)
      variables:
        AllowPtrToDetectTestRunRetryFiles: true
      steps:
      - template: e2e-setup.yml
      - template: e2e-tests.yml
        parameters:
          version: ${{ parameters.version }}
          containerAppName: '${{ parameters.containerAppName }}'
          appServiceType: 'SqlServer'
          categoryFilter: '${{ shard.categoryFilter }}'
          testRunTitleSuffix: ' ${{ shard.name }}'
          parallelizeTestCollections: ${{ parameters.e2eParallelizeTestCollections }}

- ${{ if and(eq(parameters.runBulkUpdateJob, true), eq(parameters.runShardedE2eJobs, false)) }}:
  - job: 'sqlE2eTests_BulkUpdate'
    timeoutInMinutes: 120
    dependsOn: []
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    variables:
      AllowPtrToDetectTestRunRetryFiles: true
    steps:
    - template: e2e-setup.yml
    - template: e2e-tests.yml
      parameters:
        version: ${{ parameters.version }}
        containerAppName: '${{ parameters.containerAppName }}'
        appServiceType: 'SqlServer'
        categoryFilter: 'Category=BulkUpdate'
        testRunTitleSuffix: ' BulkUpdate'
        parallelizeTestCollections: ${{ parameters.e2eParallelizeTestCollections }}

- ${{ if and(eq(parameters.runReindexJob, true), eq(parameters.runShardedE2eJobs, false)) }}:
  - job: 'sqlE2eTests_Reindex'
    timeoutInMinutes: 120
    dependsOn: []
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    variables:
      AllowPtrToDetectTestRunRetryFiles: true
    steps:
    - template: e2e-setup.yml
    - template: e2e-tests.yml
      parameters:
        version: ${{ parameters.version }}
        containerAppName: '${{ parameters.containerAppName }}'
        appServiceType: 'SqlServer'
        categoryFilter: '(Category=IndexAndReindex)&(Category!=CustomSearch)'
        testRunTitleSuffix: ' Reindex'
        parallelizeTestCollections: ${{ parameters.e2eParallelizeTestCollections }}

- ${{ if eq(parameters.runShardedE2eJobs, true) }}:
  # RequiresIsolation tests (reindex, bulk delete, and anything mutating global/server state) must not
  # overlap the parallel shards on the SAME endpoint. When a dedicated isolation endpoint is supplied
  # (isolationContainerAppName), this lane targets that endpoint + its own database and runs concurrently
  # with serial test collections. Otherwise it falls back to the serialized terminal lane on the main
  # endpoint, waiting for every shard to finish first.
  - ${{ if ne(parameters.isolationContainerAppName, '') }}:
    - job: 'sqlE2eTests_RequiresIsolation'
      timeoutInMinutes: 120
      dependsOn: []
      condition: not(canceled())
      pool:
        name: '$(InternalPool)'
        demands:
          - ImageOverride -equals $(InternalLinuxImage)
      variables:
        AllowPtrToDetectTestRunRetryFiles: true
      steps:
      - template: e2e-setup.yml
      - template: e2e-tests.yml
        parameters:
          version: ${{ parameters.version }}
          containerAppName: '${{ parameters.isolationContainerAppName }}'
          appServiceType: 'SqlServer'
          categoryFilter: '(Category=RequiresIsolation)&(Category!=ExportLongRunning)&(Category!=ImportLongRunning)'
          testRunTitleSuffix: ' RequiresIsolation'
          parallelizeTestCollections: false
  - ${{ else }}:
    - job: 'sqlE2eTests_RequiresIsolation'
      timeoutInMinutes: 120
      dependsOn:
      - ${{ each shard in parameters.e2eTestShards }}:
        - 'sqlE2eTests_${{ shard.name }}'
      condition: not(canceled())
      pool:
        name: '$(InternalPool)'
        demands:
          - ImageOverride -equals $(InternalLinuxImage)
      variables:
        AllowPtrToDetectTestRunRetryFiles: true
      steps:
      - template: e2e-setup.yml
      - template: e2e-tests.yml
        parameters:
          version: ${{ parameters.version }}
          containerAppName: '${{ parameters.containerAppName }}'
          appServiceType: 'SqlServer'
          categoryFilter: '(Category=RequiresIsolation)&(Category!=ExportLongRunning)&(Category!=ImportLongRunning)'
          testRunTitleSuffix: ' RequiresIsolation'
          parallelizeTestCollections: ${{ parameters.e2eParallelizeTestCollections }}
