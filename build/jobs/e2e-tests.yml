parameters:
- name: version
  type: string
- name: containerAppName
  type: string
- name: appServiceType
  type: string
- name: categoryFilter
  type: string
  default: 'Category!=ExportLongRunning'
- name: testRunTitleSuffix
  type: string
  default: ''
- name: resourceIdProfile
  type: string
  default: None
  values:
  - None
  - Standard64
  - Long128
  - Runtime

steps:
  - template: e2e-tests-extract.yml
    parameters:
      version: ${{parameters.version}}

  - template: ../tasks/e2e-set-variables.yml
    parameters:
      containerAppName: ${{ parameters.containerAppName }}
      version: ${{ parameters.version }}
      appServiceType: ${{ parameters.appServiceType }}
      resourceIdProfile: ${{ parameters.resourceIdProfile }}

  - task: PowerShell@2
    displayName: 'E2E ${{ parameters.version }} ${{parameters.appServiceType}}${{ parameters.testRunTitleSuffix }}'
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $testRoot = "$(Agent.TempDirectory)/E2ETests"
        $results = Join-Path "$(Agent.TempDirectory)" "testresults-$([guid]::NewGuid().ToString('N'))"
        [void](New-Item $results -ItemType Directory)
        $env:platformOptions__resultDirectory = $results
        Write-Host "##vso[task.setvariable variable=ResourceIdResultsDirectory]$results"
        $started = [DateTimeOffset]::UtcNow
        $env:ResourceIdExpectedUrl = $env:TestEnvironmentUrl_${{ parameters.version }}_Sql
        $categoryFilter = '${{ parameters.categoryFilter }}'
        $runTitle = '${{ parameters.version }} ${{ parameters.appServiceType }}${{ parameters.testRunTitleSuffix }}'
        $resultsArtifact = 'ResourceIdResults_${{ parameters.version }}_${{ parameters.resourceIdProfile }}_$(System.JobName)_attempt$(System.JobAttempt)'
        $resourceIdProfile = '${{ parameters.resourceIdProfile }}'
        if ($resourceIdProfile -ceq 'Runtime') {
          foreach ($name in @('SQLREVISIONPROFILE', 'SQLPROFILECATEGORYFILTER', 'SQLRESOURCEIDPROFILE')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Runtime resource ID profile requires the matrix variable $name."
            }
          }

          $categoryFilter = $env:SQLPROFILECATEGORYFILTER
          $runTitle = "$runTitle $($env:SQLREVISIONPROFILE)"
          $resultsArtifact = "ResourceIdResults_${{ parameters.version }}_$($env:SQLREVISIONPROFILE)_$(System.JobName)_attempt$(System.JobAttempt)"
          $resourceIdProfile = $env:SQLRESOURCEIDPROFILE
        }

        Write-Host "##vso[task.setvariable variable=ResourceIdResultsArtifact]$resultsArtifact"
        if ($resourceIdProfile -cin @('Standard64', 'Long128')) {
          $env:ResourceIdProfile = $resourceIdProfile
        } elseif ($resourceIdProfile -ceq 'None') {
          Remove-Item Env:ResourceIdProfile -ErrorAction SilentlyContinue
        } else {
          throw "Unsupported resource ID profile '$resourceIdProfile'."
        }
        $testName = "Microsoft.Health.Fhir.${{ parameters.version }}.Tests.E2E"
        $dll = Get-ChildItem -Path $testRoot -Recurse -Filter "$testName.dll" | Select-Object -First 1
        if (-not $dll) {
          throw "Could not find $testName.dll under $testRoot"
        }

        $categoryPredicates = $categoryFilter.Split('&') | ForEach-Object { "($_)" }
        $query = "/[(DataStore=${{ parameters.appServiceType }})&$($categoryPredicates -join '&')]"
        $args = @('--filter-query', $query, '--retry-failed-tests', '3', '--results-directory', $results, '--report-trx', '--publish-azdo-test-results', '--publish-azdo-run-name', $runTitle)

        Write-Host "Running dotnet $($dll.FullName)"
        & dotnet $dll.FullName @args
        $testExitCode = $LASTEXITCODE

        Get-ChildItem -Path $env:platformOptions__resultDirectory -Recurse -Filter '*.trx' -ErrorAction SilentlyContinue | ForEach-Object {
          [xml] $trx = Get-Content -Raw $_.FullName
          $trx.SelectNodes("//*[local-name()='UnitTestResult'][contains(@testName, 'GivenIncrementalLoad_WithInMemorySource')]/*[local-name()='Output']/*[local-name()='StdOut']") | ForEach-Object {
            Write-Host "In-memory import execution stats:"
            Write-Host $_.InnerText
          }
        }

        if ($resourceIdProfile -cne 'None') {
          & "$(System.DefaultWorkingDirectory)/build/jobs/scripts/Assert-ResourceIdResults.ps1" -ResultsDirectory $results -Profile $resourceIdProfile -StartedUtc $started
        }
        if ($testExitCode -ne 0) {
          throw "E2E tests failed with exit code $testExitCode"
        }
    env:
      'TestEnvironmentUrl': $(TestEnvironmentUrl)
      'TestEnvironmentUrl_${{ parameters.version }}': $(TestEnvironmentUrl_${{ parameters.version }})
      'TestEnvironmentUrl_Sql': $(TestEnvironmentUrl_Sql)
      'TestEnvironmentUrl_${{ parameters.version }}_Sql': $(TestEnvironmentUrl_${{ parameters.version }}_Sql)
      'TestTokenEndpoint': $(TestTokenEndpoint)
      'Resource': $(Resource)
      'AllStorageAccounts': $(AllStorageAccounts)
      'TestExportStoreUri': $(TestExportStoreUri)
      'TestIntegrationStoreUri': $(TestIntegrationStoreUri)
      'TestContainerRegistryServer': $(TestContainerRegistryServer)
      'tenant-admin-service-principal-name': $(tenant-admin-service-principal-name)
      'tenant-admin-service-principal-password': $(tenant-admin-service-principal-password)
      'tenant-admin-user-name': $(tenant-admin-user-name)
      'tenant-admin-user-password': $(tenant-admin-user-password)
      'tenant-id': $(tenant-id)
      'app_globalAdminServicePrincipal_id': $(app_globalAdminServicePrincipal_id)
      'app_globalAdminServicePrincipal_secret': $(app_globalAdminServicePrincipal_secret)
      'app_nativeClient_id': $(app_nativeClient_id)
      'app_nativeClient_secret': $(app_nativeClient_secret)
      'app_wrongAudienceClient_id': $(app_wrongAudienceClient_id)
      'app_wrongAudienceClient_secret': $(app_wrongAudienceClient_secret)
      'app_globalAdminUserApp_id': $(app_globalAdminUserApp_id)
      'app_globalAdminUserApp_secret': $(app_globalAdminUserApp_secret)
      'app_globalConverterUserApp_id': $(app_globalConverterUserApp_id)
      'app_globalConverterUserApp_secret': $(app_globalConverterUserApp_secret)
      'app_globalExporterUserApp_id': $(app_globalExporterUserApp_id)
      'app_globalExporterUserApp_secret': $(app_globalExporterUserApp_secret)
      'app_globalImporterUserApp_id': $(app_globalImporterUserApp_id)
      'app_globalImporterUserApp_secret': $(app_globalImporterUserApp_secret)
      'app_globalReaderUserApp_id': $(app_globalReaderUserApp_id)
      'app_globalReaderUserApp_secret': $(app_globalReaderUserApp_secret)
      'app_globalWriterUserApp_id': $(app_globalWriterUserApp_id)
      'app_globalWriterUserApp_secret': $(app_globalWriterUserApp_secret)
      'app_smartUserClient_id': $(app_smartUserClient_id)
      'app_smartUserClient_secret': $(app_smartUserClient_secret)
      'AZURESUBSCRIPTION_CLIENT_ID': $(AzurePipelinesCredential_ClientId)
      'AZURESUBSCRIPTION_TENANT_ID': $(AZURESUBSCRIPTION_TENANT_ID)
      'AZURESUBSCRIPTION_SERVICE_CONNECTION_ID': $(AZURESUBSCRIPTION_SERVICE_CONNECTION_ID)
      'SYSTEM_ACCESSTOKEN': $(System.AccessToken)
      ${{ if eq(parameters.resourceIdProfile, 'Runtime') }}:
        'SQLREVISIONPROFILE': $(SqlRevisionProfile)
        'SQLPROFILECATEGORYFILTER': $(SqlProfileCategoryFilter)
        'SQLRESOURCEIDPROFILE': $(SqlResourceIdProfile)

  - ${{ if or(eq(parameters.appServiceType, 'SqlServer'), ne(parameters.resourceIdProfile, 'None')) }}:
    - task: AzurePowerShell@5
      displayName: 'Recheck selected SQL revision after tests'
      retryCountOnTaskFailure: 1
      condition: and(succeededOrFailed(), ne('', variables['ResourceIdSelectedBinding']))
      env:
        RESOURCEIDSELECTEDPROFILE: $(ResourceIdSelectedProfile)
        RESOURCEIDSELECTEDBINDING: $(ResourceIdSelectedBinding)
      inputs:
        azureSubscription: $(ConnectedServiceName)
        azurePowerShellVersion: latestVersion
        pwsh: true
        ScriptType: InlineScript
        Inline: |
          $ErrorActionPreference = 'Stop'
          $containerApp = Get-AzResource -ResourceGroupName '$(UniqueResourceGroupName)' -ResourceType 'Microsoft.App/containerApps' -Name '${{ parameters.containerAppName }}'
          if ($null -eq $containerApp) {
            throw "Container App '${{ parameters.containerAppName }}' was not found in resource group '$(UniqueResourceGroupName)'."
          }

          $armToken = (Get-AzAccessToken -ResourceUrl 'https://management.azure.com/').Token
          if ($armToken -is [string]) {
            $armToken = ConvertTo-SecureString -String $armToken -AsPlainText -Force
          }

          $selection = & "$(System.DefaultWorkingDirectory)/build/jobs/scripts/Sync-SqlRevisions.ps1" -Goal Resolve -AppResourceId $containerApp.ResourceId -AccessToken $armToken -RevisionProfile $env:RESOURCEIDSELECTEDPROFILE -Binding $env:RESOURCEIDSELECTEDBINDING -Expect
          $armToken = $null
          if (-not $selection.Ready) {
            throw "Selected revision '$($selection.Revision)' is no longer active, provisioned and healthy after the tests."
          }

          Write-Host "After the tests revision '$($selection.Revision)' (label '$($selection.Label)', baseline '$($selection.BaselineRevision)') still serves $($selection.Url) with the captured template."

    - task: PublishBuildArtifacts@1
      displayName: 'Publish resource ID contract TRX'
      condition: and(succeededOrFailed(), ne('', variables['ResourceIdResultsArtifact']))
      inputs:
        pathToPublish: $(ResourceIdResultsDirectory)
        artifactName: $(ResourceIdResultsArtifact)
