# One share of the unit tests (Tier 1): builds only the unit test projects of the share and what they reference, then
# runs them without code coverage. Needs nothing from the UpdateVersion stage (placeholder versions), so it starts as
# soon as an agent is free. The share is chosen by Invoke-ParallelUnitTests.ps1 -ModuleShard from
# build/test-shards/unit-tests.json; the build and the test step use the same selection. Analyzers and
# warnings-as-errors stay off: the build artifact stage builds the whole solution with them.
parameters:
- name: jobName
  type: string
- name: targetFramework
  type: string
# '<index>/<count>', for example '1/2'.
- name: moduleShard
  type: string

jobs:
- job: ${{ parameters.jobName }}
  displayName: 'Unit tests ${{ parameters.targetFramework }} (${{ parameters.moduleShard }})'
  pool:
    name: '$(InternalPool)'
    demands:
      - ImageOverride -equals $(InternalLinuxImage)
  steps:
  - checkout: self
    fetchDepth: 1
    fetchTags: false

  - task: UseDotNet@2
    displayName: 'Use .NET SDKs from global.json files'
    inputs:
      useGlobalJson: true

  - pwsh: |
      & "$(System.DefaultWorkingDirectory)/build/scripts/Invoke-ParallelUnitTests.ps1" -Framework "${{ parameters.targetFramework }}" -Configuration "$(buildConfiguration)" -SourceRoot "$(Build.SourcesDirectory)/src" -ModuleShard "${{ parameters.moduleShard }}" -SolutionFilterPath "$(Agent.TempDirectory)/unit-tests-shard.slnf"
    displayName: 'Select unit test projects (shard ${{ parameters.moduleShard }})'
    workingDirectory: $(System.DefaultWorkingDirectory)

  - task: DotNetCoreCLI@2
    displayName: 'dotnet build shard ${{ parameters.moduleShard }}'
    inputs:
      command: build
      projects: '$(Agent.TempDirectory)/unit-tests-shard.slnf'
      arguments: '--configuration $(buildConfiguration) -f ${{ parameters.targetFramework }} -p:ContinuousIntegrationBuild=true -p:Version=0.0.0-pr -p:AssemblyVersion=0.0.0.0 -p:FileVersion=0.0.0.0 -p:RunAnalyzers=false -p:EnableNETAnalyzers=false -p:TreatWarningsAsErrors=false'
      workingDirectory: $(System.DefaultWorkingDirectory)

  - pwsh: |
      & "$(System.DefaultWorkingDirectory)/build/scripts/Invoke-ParallelUnitTests.ps1" -Framework "${{ parameters.targetFramework }}" -Configuration "$(buildConfiguration)" -SourceRoot "$(Build.SourcesDirectory)/src" -ModuleShard "${{ parameters.moduleShard }}" -TestArguments '--retry-failed-tests','3','--report-trx','--publish-azdo-test-results','--publish-azdo-run-name','Unit Tests ${{ parameters.targetFramework }} (${{ parameters.moduleShard }})'
      exit $LASTEXITCODE
    displayName: 'dotnet test (shard ${{ parameters.moduleShard }})'
    workingDirectory: $(System.DefaultWorkingDirectory)
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
