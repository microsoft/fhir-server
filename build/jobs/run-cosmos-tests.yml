parameters:
- name: version
  type: string
- name: keyVaultName
  type: string
- name: containerAppName
  type: string
- name: isolationContainerAppName
  type: string
  default: ''
- name: mainCategoryFilter
  type: string
  default: '(Category!=ExportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)'
- name: runReindexJob
  type: boolean
  default: true
- name: integrationParallelizeTestCollections
  type: boolean
  default: false
- name: e2eParallelizeTestCollections
  type: boolean
  default: false
- name: runShardedIntegrationTests
  type: boolean
  default: false
- name: integrationTestShards
  type: object
  default:
    - name: General
      filterArguments: ['--filter-not-trait', 'Category=SmartOnFhir', 'Category=IndexAndReindex', 'Category=Search', 'Category=SearchParameterStatus', 'DataStore=CosmosDb', '--filter-not-class', '*CosmosDb*']
    - name: SmartSearch
      filterArguments: ['--filter-trait', 'Category=SmartOnFhir']
    - name: Search
      filterArguments: ['--filter-trait', 'Category=Search', 'Category=SearchParameterStatus', '--filter-not-trait', 'Category=SmartOnFhir']
    - name: Reindex
      filterArguments: ['--filter-trait', 'Category=IndexAndReindex']
    - name: CosmosVariants
      filterArguments: ['--filter-trait', 'DataStore=CosmosDb', '--filter-not-trait', 'Category=IndexAndReindex', 'Category=Search', 'Category=SearchParameterStatus', 'Category=SmartOnFhir']
    # CosmosVariants owns fixture variants; CosmosSpecific owns Cosmos-named classes without that trait.
    - name: CosmosSpecific
      filterArguments: ['--filter-class', '*CosmosDb*', '--filter-not-trait', 'DataStore=CosmosDb', 'Category=IndexAndReindex', 'Category=Search', 'Category=SearchParameterStatus', 'Category=SmartOnFhir']
- name: runShardedE2eJobs
  type: boolean
  default: false
- name: e2eTestShards
  type: object
  # mainCategoryFilter default is inlined here because ADO does not allow ${{ parameters.x }} in object parameter defaults.
  default:
    - name: General
      categoryFilter: '(Category!=ExportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)&(Category!=BulkDelete)&(Category!=CustomSearch)&(Category!=History)&(Category!=Import)&(Category!=Search)&(Category!=Sort)&(Category!=CompartmentSearch)&(Category!=ConditionalOperations)&(Category!=Patch)&(Category!=Bundle)&(Category!=BundleTransaction)'
    - name: Search
      categoryFilter: '(Category!=ExportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)&((Category=Search)|(Category=Sort)|(Category=CompartmentSearch))&(Category!=CustomSearch)&(Category!=BundleTransaction)'
    - name: Mutation
      categoryFilter: '(Category!=ExportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)&((Category=ConditionalOperations)|(Category=Patch)|(Category=Bundle)|(Category=BundleTransaction))'
    - name: History
      categoryFilter: '(Category!=ExportLongRunning)&(Category!=RequiresIsolation)&(Category!=IndexAndReindex)&(Category=History)'

jobs:

- ${{ if eq(parameters.runShardedIntegrationTests, false) }}:
  - job: "CosmosIntegrationTests"
    timeoutInMinutes: 75
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    variables:
      AllowPtrToDetectTestRunRetryFiles: true
    steps:
    - checkout: self
      fetchDepth: 1
      fetchTags: false
      path: source

    - template: integration-setup.yml

    - template: integration-tests-extract.yml
      parameters:
        version: ${{ parameters.version }}

    - template: integration-tests-run.yml
      parameters:
        version: ${{ parameters.version }}
        dataStore: 'Cosmos'
        keyVaultName: '${{ parameters.keyVaultName }}'
        containerAppName: '${{ parameters.containerAppName }}'
        filterArguments: []
        testRunTitle: '${{ parameters.version }} Cosmos Integration Tests'
        artifactSuffix: 'Cosmos_${{ parameters.version }}'
        parallelizeTestCollections: ${{ parameters.integrationParallelizeTestCollections }}

- ${{ if eq(parameters.runShardedIntegrationTests, true) }}:
  - ${{ each shard in parameters.integrationTestShards }}:
    - job: 'CosmosIntegrationTests_${{ shard.name }}'
      timeoutInMinutes: 75
      ${{ if eq(shard.name, 'SmartSearch') }}:
        condition: or(eq('${{ parameters.version }}', 'R4'), eq('${{ parameters.version }}', 'R4B'))
      pool:
        name: '$(InternalPool)'
        demands:
          - ImageOverride -equals $(InternalLinuxImage)
      variables:
        AllowPtrToDetectTestRunRetryFiles: true
      steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
        path: source

      - template: integration-setup.yml

      - template: integration-tests-extract.yml
        parameters:
          version: ${{ parameters.version }}

      - template: integration-tests-run.yml
        parameters:
          version: ${{ parameters.version }}
          dataStore: 'Cosmos'
          keyVaultName: '${{ parameters.keyVaultName }}'
          containerAppName: '${{ parameters.containerAppName }}'
          filterArguments: ${{ shard.filterArguments }}
          testRunTitle: '${{ parameters.version }} Cosmos Integration Tests ${{ shard.name }}'
          artifactSuffix: 'Cosmos_${{ parameters.version }}_${{ shard.name }}'
          parallelizeTestCollections: ${{ parameters.integrationParallelizeTestCollections }}

- ${{ if eq(parameters.runShardedE2eJobs, false) }}:
  - job: 'cosmosE2eTests'
    timeoutInMinutes: 75
    dependsOn: []
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    variables:
      AllowPtrToDetectTestRunRetryFiles: true
    steps:
    - template: e2e-setup.yml
    - template: e2e-tests.yml
      parameters:
        version: ${{ parameters.version }}
        containerAppName: '${{ parameters.containerAppName }}'
        appServiceType: 'CosmosDb'
        categoryFilter: '${{ parameters.mainCategoryFilter }}'
        parallelizeTestCollections: ${{ parameters.e2eParallelizeTestCollections }}

- ${{ if eq(parameters.runShardedE2eJobs, true) }}:
  - ${{ each shard in parameters.e2eTestShards }}:
    - job: 'cosmosE2eTests_${{ shard.name }}'
      timeoutInMinutes: 75
      dependsOn: []
      pool:
        name: '$(InternalPool)'
        demands:
          - ImageOverride -equals $(InternalLinuxImage)
      variables:
        AllowPtrToDetectTestRunRetryFiles: true
      steps:
      - template: e2e-setup.yml
      - template: e2e-tests.yml
        parameters:
          version: ${{ parameters.version }}
          containerAppName: '${{ parameters.containerAppName }}'
          appServiceType: 'CosmosDb'
          categoryFilter: '${{ shard.categoryFilter }}'
          testRunTitleSuffix: ' ${{ shard.name }}'
          parallelizeTestCollections: ${{ parameters.e2eParallelizeTestCollections }}

- ${{ if eq(parameters.runShardedE2eJobs, true) }}:
  # RequiresIsolation tests (reindex, bulk delete, and anything mutating global/server state) must not
  # overlap the parallel shards on the SAME endpoint. When a dedicated isolation endpoint is supplied
  # (isolationContainerAppName -> its own Cosmos account), this lane runs concurrently with serial test
  # collections. Otherwise, it remains terminal on the main endpoint.
  - ${{ if ne(parameters.isolationContainerAppName, '') }}:
    - job: 'cosmosE2eTests_RequiresIsolation'
      timeoutInMinutes: 75
      condition: not(canceled())
      dependsOn: []
      pool:
        name: '$(InternalPool)'
        demands:
          - ImageOverride -equals $(InternalLinuxImage)
      variables:
        AllowPtrToDetectTestRunRetryFiles: true
      steps:
      - template: e2e-setup.yml
      - template: e2e-tests.yml
        parameters:
          version: ${{ parameters.version }}
          containerAppName: '${{ parameters.isolationContainerAppName }}'
          appServiceType: 'CosmosDb'
          categoryFilter: '(Category=RequiresIsolation)&(Category!=ExportLongRunning)'
          testRunTitleSuffix: ' RequiresIsolation'
          parallelizeTestCollections: false
  - ${{ else }}:
    - job: 'cosmosE2eTests_RequiresIsolation'
      timeoutInMinutes: 75
      dependsOn:
      - ${{ each shard in parameters.e2eTestShards }}:
        - 'cosmosE2eTests_${{ shard.name }}'
      condition: not(canceled())
      pool:
        name: '$(InternalPool)'
        demands:
          - ImageOverride -equals $(InternalLinuxImage)
      variables:
        AllowPtrToDetectTestRunRetryFiles: true
      steps:
      - template: e2e-setup.yml
      - template: e2e-tests.yml
        parameters:
          version: ${{ parameters.version }}
          containerAppName: '${{ parameters.containerAppName }}'
          appServiceType: 'CosmosDb'
          categoryFilter: '(Category=RequiresIsolation)&(Category!=ExportLongRunning)'
          testRunTitleSuffix: ' RequiresIsolation'
          parallelizeTestCollections: ${{ parameters.e2eParallelizeTestCollections }}

- ${{ if and(eq(parameters.runReindexJob, true), eq(parameters.runShardedE2eJobs, false)) }}:
  - job: 'cosmosE2eTests_Reindex'
    timeoutInMinutes: 75
    dependsOn: []
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    variables:
      AllowPtrToDetectTestRunRetryFiles: true
    steps:
    - template: e2e-setup.yml
    - template: e2e-tests.yml
      parameters:
        version: ${{ parameters.version }}
        containerAppName: '${{ parameters.containerAppName }}'
        appServiceType: 'CosmosDb'
        categoryFilter: 'Category=IndexAndReindex'
        testRunTitleSuffix: ' Reindex'
        parallelizeTestCollections: ${{ parameters.e2eParallelizeTestCollections }}
