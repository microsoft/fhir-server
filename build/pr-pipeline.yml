# DESCRIPTION: 	
# Builds, tests, and packages the solution for all PR requests.	

trigger: none

parameters:
# Adds shadow stages that run tests against containers on the agent (build/templates/stages/container-tests.yml).
# Nothing depends on them and their failures surface only as warnings.
- name: containerShadow
  displayName: 'Run shadow container test stages'
  type: boolean
  default: false
# legacy: today's stages. tier1Shadow: today's stages plus the Tier 1 stages as a shadow (never fail the run).
# tier1: the Tier 1 stages; the build artifact and deployed-environment stages run only when the PR's scope is full.
- name: validationMode
  displayName: 'Validation mode'
  type: string
  default: 'legacy'
  values:
  - 'legacy'
  - 'tier1Shadow'
  - 'tier1'
# The Classify stage sets the scope from the PR's changes (build/templates/jobs/classify-pr.yml): lean runs Tier 1 for
# R4; shared adds Stu3 and R5; full adds, in tier1 mode, the build artifact and deployed-environment stages. auto
# classifies; another value sets the scope of a manual run (ignored in PR runs).
- name: tier1Scope
  displayName: 'Tier 1 scope (manual runs)'
  type: string
  default: 'auto'
  values:
  - 'auto'
  - 'lean'
  - 'shared'
  - 'full'

variables:
- template: pr-variables.yml
- template: build-variables.yml

stages:
- stage: UpdateVersion
  displayName: 'Determine Semver'
  dependsOn: []
  jobs:
  - job: Semver
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    steps:
    - template: ./templates/steps/update-semver.yml  
    - powershell: |
        $buildNumber = "$(semVer)".replace(".", "").replace("-", "")
        $buildNumber = $buildNumber.subString(0, [System.Math]::Min(15, $buildNumber.Length))

        Write-Host "##vso[build.updatebuildnumber]$buildNumber" 
        Write-Host "Updated  build number to '$buildNumber"
      name: SetBuildVersion

- stage: ValidateDependabotDiscovery
  displayName: 'Validate Dependabot discovery project'
  dependsOn: []
  jobs:
  - job: Validate
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET SDK'
      inputs:
        useGlobalJson: true
    # Checks that the discovery project's package list still matches Directory.Packages.props, that
    # every version resolves, that the solution has not claimed the project, and that dependabot.yml
    # still points at it. Each of those failing silently stops Dependabot updating NuGet packages.
    # This only evaluates the project, so it needs no package feeds and takes about a second.
    # See build/DependabotDiscovery/README.md.
    - script: dotnet msbuild build/DependabotDiscovery -t:ValidateDependabotCoverage
      displayName: 'Validate Dependabot discovery project'

# tier1 runs the unit tests as four shard jobs that wait for nothing; the other modes build the whole solution once per
# framework (tier1Shadow keeps this stage unchanged and adds no shadow unit test jobs).
- ${{ if eq(parameters.validationMode, 'tier1') }}:
  - template: ./templates/stages/unit-tests-tier1.yml
- ${{ else }}:
  - stage: BuildUnitTests
    displayName: 'Build and run unit tests'
    dependsOn:
    - UpdateVersion
    variables:
      assemblySemVer: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.assemblySemVer']]
      assemblySemFileVer: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.assemblySemFileVer']]
      informationalVersion: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.informationalVersion']]
      majorMinorPatch: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.majorMinorPatch']]
      nuGetVersion: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.nuGetVersion']]
    jobs:
    - job: Windows_dotnet11
      pool:
        name: '$(InternalPool)'
        demands:
          - ImageOverride -equals $(InternalWindowsImage)
      steps:
      - template: ./templates/steps/dotnet-build.yml
        parameters:
          targetBuildFramework: $(defaultBuildFramework)
          unitTest: false
          codeCoverage: true
          parallelUnitTests: true

# Tier 1 (stages/tier1.yml, with the Classify stage): tier1Shadow adds it beside the stages below, as a shadow; tier1
# runs the stages below only when Classify's scope is full.
- ${{ if ne(parameters.validationMode, 'legacy') }}:
  - template: ./templates/stages/tier1.yml
    parameters:
      shadow: ${{ eq(parameters.validationMode, 'tier1Shadow') }}
      scopeOverride: ${{ parameters.tier1Scope }}

# The build artifacts, the container shadow stages (which use them) and the deployed environments. Nothing above
# depends on these stages.
# In tier1 mode the stages that depend on no other stage below (BuildArtifacts, DockerBuild, provisionEnvironment)
# also depend on Classify and run only when its scope is full and no maintainer is required, routing fork PRs away
# from them. This is routing, not a security boundary (the PR supplies this file); the approval check on the
# privileged service connection is the gate (ADR-2611). Every other stage below depends on one of them, so it is
# skipped with them, and skipped stages leave the run green.
- stage: BuildArtifacts
  displayName: 'Build artifacts'
  dependsOn:
  - UpdateVersion
  - ${{ if eq(parameters.validationMode, 'tier1') }}:
    - Classify
  ${{ if eq(parameters.validationMode, 'tier1') }}:
    condition: and(succeeded(), eq(dependencies.Classify.outputs['ClassifyPr.scope.ValidationScope'], 'full'), ne(dependencies.Classify.outputs['ClassifyPr.scope.FullRequiresMaintainer'], 'true'))
  variables:
    assemblySemVer: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.assemblySemVer']]
    assemblySemFileVer: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.assemblySemFileVer']]
    informationalVersion: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.informationalVersion']]
    majorMinorPatch: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.majorMinorPatch']]
    nuGetVersion: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.nuGetVersion']]
  jobs:
  - job: Linux_BuildAndPackage
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    steps:
    - template: ./templates/steps/dotnet-build.yml
      parameters:
        codeCoverage: false
        unitTest: false
        componentGovernance: true
        packageArtifacts: true
        packageIntegrationTests: true

- stage: AnalyzeSecurity
  displayName: 'Run Security Analysis and Validate'
  dependsOn:
  - BuildArtifacts
  jobs:
  - job: Guardian
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalWindowsImage)
    steps:
    - template: ./templates/steps/analyze.yml
      parameters:
        fastCleanup: true

- ${{ if parameters.containerShadow }}:
  - template: ./templates/stages/container-tests.yml

- stage: DockerBuild  
  displayName: 'Build images'
  dependsOn:
  - UpdateVersion
  - ${{ if eq(parameters.validationMode, 'tier1') }}:
    - Classify
  ${{ if eq(parameters.validationMode, 'tier1') }}:
    condition: and(succeeded(), eq(dependencies.Classify.outputs['ClassifyPr.scope.ValidationScope'], 'full'), ne(dependencies.Classify.outputs['ClassifyPr.scope.FullRequiresMaintainer'], 'true'))
  variables:
    assemblySemFileVer: $[stageDependencies.UpdateVersion.Semver.outputs['SetVariablesFromGitVersion.assemblySemFileVer']]
  jobs:
  - template: ./templates/jobs/docker-build-all.yml
    parameters: 
      tag: $(ImageTag)
      buildPlatform: $(testDockerImagePlatforms)

- stage: cleanupOldResources
  displayName: 'Cleanup Old PR Resources'
  dependsOn: 
  - setupEnvironment
  jobs:
  - job: deleteOldResourceGroups
    displayName: 'Delete Old Resource Groups'
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    steps:
    - template: ./templates/steps/delete-resource-groups.yml

- stage: provisionEnvironment
  displayName: Provision Environment
  ${{ if eq(parameters.validationMode, 'tier1') }}:
    dependsOn:
    - Classify
    condition: and(succeeded(), eq(dependencies.Classify.outputs['ClassifyPr.scope.ValidationScope'], 'full'), ne(dependencies.Classify.outputs['ClassifyPr.scope.FullRequiresMaintainer'], 'true'))
  ${{ else }}:
    dependsOn: []
  jobs:
  - job: provision
    displayName: 'Create Resource Group'
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    steps:
    - task: AzurePowerShell@5
      displayName: Provision Resource Group
      inputs:
        azureSubscription: $(ConnectedServiceName)
        azurePowerShellVersion: latestVersion
        pwsh: true
        ScriptType: inlineScript
        Inline: |
          # Import retry helper for transient error handling
          . $(System.DefaultWorkingDirectory)/release/scripts/PowerShell/Invoke-WithRetry.ps1

          # Handle re-run scenario: remove existing RG for this build if it exists
          try
          {
            Get-AzResourceGroup -Name $(UniqueResourceGroupName) | Remove-AzResourceGroup -Verbose -Force
          }
          catch
          {}
          # Create new resource group with unique name and retry logic
          Invoke-WithRetry -OperationName "Create Resource Group" -ScriptBlock {
            New-AzResourceGroup -Name "$(UniqueResourceGroupName)" -Location "$(ResourceGroupRegion)" -Force -ErrorAction Stop
          }
          Write-Host "Created resource group: $(UniqueResourceGroupName)"
    - template: ./templates/steps/add-resource-group-role-assignments.yml
      parameters:
        azureSubscription: $(ConnectedServiceName)
        resourceGroupName: $(UniqueResourceGroupName)

- stage: setupEnvironment
  displayName: Setup Test Environment
  dependsOn:
  - UpdateVersion
  - provisionEnvironment
  jobs:
  - template: ./templates/jobs/cleanup-aad.yml
  - job: deleteKeyVaults
    displayName: 'Delete and Purge Key Vaults'
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    steps:
    - template: ./templates/steps/delete-keyvaults.yml
  - job: setup
    displayName: 'Setup AAD'
    dependsOn:
    - cleanupAad
    - deleteKeyVaults
    pool:
      name: '$(AzurePipelinesPool)'
      vmImage: '$(WindowsVmImage)'
    steps:
    - template: ./templates/steps/add-aad-test-environment.yml
  - job: createAcaEnvironment
    displayName: 'Create ACA Managed Environment'
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    steps:
    - task: AzurePowerShell@5
      displayName: 'Create ACA Managed Environment'
      inputs:
        azureSubscription: $(ConnectedServiceName)
        azurePowerShellVersion: latestVersion
        pwsh: true
        ScriptType: inlineScript
        Inline: |
          $envName = '$(AcaEnvironmentName)'.ToLowerInvariant()
          $rgName = '$(UniqueResourceGroupName)'
          $location = '$(ResourceGroupRegion)'

          if ($envName.Length -gt 32) {
              $envName = $envName.Substring(0, 32).TrimEnd('-')
          }

          $existing = Get-AzResource -ResourceGroupName $rgName -ResourceType 'Microsoft.App/managedEnvironments' -Name $envName -ErrorAction SilentlyContinue
          if ($null -ne $existing) {
              Write-Host "ACA managed environment '$envName' already exists."
              return
          }

          Write-Host "Creating ACA managed environment '$envName' in '$rgName'..."
          New-AzResourceGroupDeployment `
              -Name "aca-env-$envName" `
              -ResourceGroupName $rgName `
              -TemplateFile $(System.DefaultWorkingDirectory)/samples/templates/aca/aca-environment.bicep `
              -environmentName $envName `
              -location $location `
              -Verbose -ErrorAction Stop
          Write-Host "ACA managed environment '$envName' created successfully."

- stage: createNsp
  displayName: 'Create Network Security Perimeter'
  dependsOn:
  - provisionEnvironment
  jobs:
  - template: ./templates/jobs/provision-nsp.yml
    parameters:
      resourceGroup: $(UniqueResourceGroupName)
      nspName: 'nsp-$(UniqueResourceGroupName)'
      nspProfile: 'default'

- stage: associateKeyVaultNsp
  displayName: 'Associate KeyVault with NSP'
  dependsOn:
  - setupEnvironment
  - createNsp
  jobs:
  - template: ./templates/jobs/associate-keyvault-nsp.yml
    parameters:
      resourceGroup: $(UniqueResourceGroupName)
      keyVaultName: '$(KeyVaultBaseName)-ts'
      nspName: 'nsp-$(UniqueResourceGroupName)'
      nspProfile: 'default'

- stage: deploySqlServer
  displayName: 'Deploy SQLServer'
  dependsOn:
  - createNsp
  - setupEnvironment
  jobs:
  - template: ./templates/jobs/provision-sqlServer.yml
    parameters:
      resourceGroup: $(UniqueResourceGroupName)
      sqlServerName: $(DeploymentEnvironmentName)
      adminType: 'userAssignedManagedIdentity'
      adminUserAssignedManagedIdentityName: "$(DeploymentEnvironmentName)-uami"
      deploymentName: "AppServer"
      nspName: 'nsp-$(UniqueResourceGroupName)'
  - template: ./templates/jobs/provision-sqlServer.yml
    parameters:
      resourceGroup: $(UniqueResourceGroupName)
      sqlServerName: $(DeploymentEnvironmentName)inttest
      adminType: 'federatedServiceConnection'
      deploymentName: "IntegrationTests"
      nspName: 'nsp-$(UniqueResourceGroupName)'

- template: ./templates/stages/pr-deploy-and-test-matrix.yml

- template: ./templates/stages/cleanup-pr-test-resources.yml
  parameters:
    testStage: testStu3Sql
    version: Stu3

- template: ./templates/stages/cleanup-pr-test-resources.yml
  parameters:
    testStage: testR4Sql
    version: R4

- template: ./templates/stages/cleanup-pr-test-resources.yml
  parameters:
    testStage: testR5Sql
    version: R5

- stage: aggregateCoverage
  displayName: 'Aggregate All Coverage Reports'
  dependsOn:
  - BuildUnitTests
  - testStu3Cosmos
  - testStu3Sql
  - testR4Cosmos
  - testR4Sql
  - testR5Sql
  jobs:
  - job: AggregateCoverage
    displayName: 'Aggregate coverage from all test types and versions'
    pool:
      name: '$(InternalPool)'
      demands:
        - ImageOverride -equals $(InternalLinuxImage)
    steps:
    - template: ./templates/steps/aggregate-coverage.yml
